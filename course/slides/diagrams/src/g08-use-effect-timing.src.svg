<?xml version="1.0" encoding="UTF-8"?>
<!-- 손으로 쓴 그림(G8). archify 5개 타입에 맞지 않는 "실행 시점 표"라서 직접 그렸다.
     색·글꼴·도형은 archify 결과와 같게 하려고 같은 CSS 클래스(c-*, t-*, a-*)만 쓴다.
     <style> 안의 표시는 src/build-hand-svg.py 가 archify SVG의 스타일로 바꿔 넣는다. -->
<svg data-theme="light" viewBox="0 0 800 440" width="800" height="440" role="img" lang="ko" aria-labelledby="g08-title g08-desc" xmlns="http://www.w3.org/2000/svg">
  <style>/*ARCHIFY_STYLE*/</style>
  <rect width="100%" height="100%" class="c-bg-rect"/>
  <title id="g08-title">useEffect 실행 시점</title>
  <desc id="g08-desc">렌더링, 화면 반영, effect 실행 순서와 의존성 배열 세 경우(없음, 빈 배열, [notes])에 따른 effect 재실행 여부.</desc>
  <defs>
    <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 1. 한 번의 렌더링에서 일어나는 순서 -->
  <text x="40" y="34" class="t-primary" font-size="12" font-weight="650">한 번의 렌더링에서 일어나는 순서</text>
  <path d="M 230 80 L 305 80" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
  <path d="M 495 80 L 570 80" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
  <g>
    <rect x="40" y="50" width="190" height="60" rx="6" class="c-mask"/>
    <rect x="40" y="50" width="190" height="60" rx="6" class="c-frontend" stroke-width="1.5"/>
    <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(46 56) scale(0.6875)"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6.5h12"/><circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/><circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/></g>
    <text x="135" y="78" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">1. 렌더링</text>
    <text x="135" y="94" class="t-muted" font-size="9" text-anchor="middle">컴포넌트 함수 실행</text>
  </g>
  <g>
    <rect x="305" y="50" width="190" height="60" rx="6" class="c-mask"/>
    <rect x="305" y="50" width="190" height="60" rx="6" class="c-frontend" stroke-width="1.5"/>
    <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(311 56) scale(0.6875)"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6.5h12"/><circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/><circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/></g>
    <text x="400" y="78" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">2. 화면 반영</text>
    <text x="400" y="94" class="t-muted" font-size="9" text-anchor="middle">바뀐 부분이 화면에 그려진다</text>
  </g>
  <g>
    <rect x="570" y="50" width="190" height="60" rx="6" class="c-mask"/>
    <rect x="570" y="50" width="190" height="60" rx="6" class="c-backend" stroke-width="1.5"/>
    <g aria-hidden="true" class="semantic-sigil s-backend" transform="translate(576 56) scale(0.6875)"><path d="M6 3 3 8l3 5M10 3l3 5-3 5"/></g>
    <text x="665" y="78" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">3. effect 실행</text>
    <text x="665" y="94" class="t-muted" font-size="9" text-anchor="middle">useEffect에 넣은 함수</text>
  </g>

  <!-- 2. 의존성 배열에 따른 실행 여부 -->
  <text x="40" y="158" class="t-primary" font-size="12" font-weight="650">의존성 배열에 따라 effect가 실행되는 때</text>
  <text x="380" y="184" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">처음 렌더링</text>
  <text x="380" y="198" class="t-muted" font-size="9" text-anchor="middle">화면에 처음 나타남</text>
  <text x="540" y="184" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">다시 렌더링</text>
  <text x="540" y="198" class="t-muted" font-size="9" text-anchor="middle">query가 바뀜</text>
  <text x="700" y="184" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">다시 렌더링</text>
  <text x="700" y="198" class="t-muted" font-size="9" text-anchor="middle">notes가 바뀜</text>
  <path d="M 40 204 L 760 204" style="stroke: var(--lane-stroke); fill: none;" stroke-width="1"/>
  <text x="40" y="229" class="t-primary" font-size="11" font-weight="600">useEffect(fn)</text>
  <text x="40" y="245" class="t-muted" font-size="9">배열 없음 → 매 렌더링 후</text>
  <rect x="320" y="212" width="120" height="40" rx="6" class="c-mask"/>
  <rect x="320" y="212" width="120" height="40" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="380" y="236" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">effect 실행</text>
  <rect x="480" y="212" width="120" height="40" rx="6" class="c-mask"/>
  <rect x="480" y="212" width="120" height="40" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="540" y="236" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">effect 실행</text>
  <rect x="640" y="212" width="120" height="40" rx="6" class="c-mask"/>
  <rect x="640" y="212" width="120" height="40" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="700" y="236" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">effect 실행</text>
  <path d="M 40 260 L 760 260" style="stroke: var(--lane-stroke); fill: none;" stroke-width="1"/>
  <text x="40" y="285" class="t-primary" font-size="11" font-weight="600">useEffect(fn, [])</text>
  <text x="40" y="301" class="t-muted" font-size="9">빈 배열 → 처음 한 번</text>
  <rect x="320" y="268" width="120" height="40" rx="6" class="c-mask"/>
  <rect x="320" y="268" width="120" height="40" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="380" y="292" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">effect 실행</text>
  <rect x="480" y="268" width="120" height="40" rx="6" class="c-external" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="540" y="292" class="t-muted" font-size="10" font-weight="600" text-anchor="middle">건너뜀</text>
  <rect x="640" y="268" width="120" height="40" rx="6" class="c-external" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="700" y="292" class="t-muted" font-size="10" font-weight="600" text-anchor="middle">건너뜀</text>
  <path d="M 40 316 L 760 316" style="stroke: var(--lane-stroke); fill: none;" stroke-width="1"/>
  <text x="40" y="341" class="t-primary" font-size="11" font-weight="600">useEffect(fn, [notes])</text>
  <text x="40" y="357" class="t-muted" font-size="9">notes가 바뀔 때만</text>
  <rect x="320" y="324" width="120" height="40" rx="6" class="c-mask"/>
  <rect x="320" y="324" width="120" height="40" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="380" y="348" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">effect 실행</text>
  <rect x="480" y="324" width="120" height="40" rx="6" class="c-external" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="540" y="348" class="t-muted" font-size="10" font-weight="600" text-anchor="middle">건너뜀</text>
  <rect x="640" y="324" width="120" height="40" rx="6" class="c-mask"/>
  <rect x="640" y="324" width="120" height="40" rx="6" class="c-backend" stroke-width="1.5"/>
  <text x="700" y="348" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">effect 실행</text>

  <!-- 범례 -->
  <g>
    <text x="40" y="404" class="t-primary" font-size="12" font-weight="650">범례</text>
    <rect x="40" y="415" width="16" height="10" rx="2.5" class="c-frontend" stroke-width="1"/>
    <text x="62" y="424" class="t-muted" font-size="10" font-weight="500">화면 · 컴포넌트</text>
    <rect x="180" y="415" width="16" height="10" rx="2.5" class="c-backend" stroke-width="1"/>
    <text x="202" y="424" class="t-muted" font-size="10" font-weight="500">실행되는 코드</text>
  </g>
</svg>
